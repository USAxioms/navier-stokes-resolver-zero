<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navier–Stokes Solver UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #222;
      padding: 20px;
      border-radius: 10px;
    }
    input, button, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    pre {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Navier–Stokes Axiomatic Solver</h2>

    <label>External Time (t)</label>
    <input id="external_time" type="number" value="1">

    <label>Velocity (v)</label>
    <input id="velocity" type="number" value="1">

    <label>Viscosity (ν)</label>
    <input id="viscosity" type="number" value="10000000000000000">

    <button onclick="runSolver()">Resolve Flow</button>

    <h3>Output</h3>
    <pre id="output">Waiting for simulation...</pre>
  </div>

  <script>
    async function runSolver() {
      const external_time = parseInt(document.getElementById("external_time").value);
      const velocity = parseInt(document.getElementById("velocity").value);
      const viscosity = parseInt(document.getElementById("viscosity").value);

      const payload = {
        external_time,
        velocity,
        viscosity
      };

      document.getElementById("output").innerText = "Running evaluation...";

      try {
        const response = await fetch("/resolve-flow", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        document.getElementById("output").innerText = JSON.stringify(data, null, 2);

      } catch (error) {
        document.getElementById("output").innerText = "Error: " + error;
      }
    }
  </script>
</body>
</html>
